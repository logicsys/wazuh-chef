---
driver:
  name: vagrant

transport:
  name: ssh

provisioner:
  name: chef-zero
  chef_license: accept

verifier:
  name: inspec

platforms:
  - name: amazonlinux-2
  - name: debian-11
  - name: debian-12
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: fedora-latest

suites:
  - name: wazuh-single-node
    run_list:
      - recipe[wazuh_indexer::default]
      - recipe[wazuh_manager::default]
      - recipe[wazuh_dashboard::default]
    verifier:
      inspec_tests:
        - path: ../cookbooks/wazuh_indexer/test/integration/wazuh_indexer
        - path: ../cookbooks/wazuh_manager/test/integration/wazuh_manager
        - path: ../cookbooks/wazuh_dashboard/test/integration/wazuh_dashboard

  - name: wazuh_agent
    run_list:
      - recipe[wazuh_agent::default]
    verifier:
      inspec_tests:
        - path: ../cookbooks/wazuh_agent/test/integration/wazuh_agent

  - name: wazuh_indexer
    run_list:
      - recipe[wazuh_indexer::default]
    verifier:
      inspec_tests:
        - path: ../cookbooks/wazuh_indexer/test/integration/wazuh_indexer

  - name: wazuh_manager
    run_list:
      - recipe[wazuh_manager::default]
    verifier:
      inspec_tests:
        - path: ../cookbooks/wazuh_manager/test/integration/wazuh_manager

  - name: wazuh_dashboard
    run_list:
      - recipe[wazuh_dashboard::default]
    verifier:
      inspec_tests:
        - path: ../cookbooks/wazuh_dashboard/test/integration/wazuh_dashboard
