  #   verifier:
  #     inspec_tests:
  #       - name: wazuh-manager tests
  #         path: ./cookbooks/wazuh_manager/test/integration/wazuh_manager

  # - name: wazuh-dashboard
  #   run_list:
  #     - recipe[wazuh_dashboard::default]
  #   driver:
  #     hostname: wazuh-dashboard
  #     customize:
