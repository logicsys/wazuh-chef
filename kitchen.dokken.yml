---
driver:
  name: dokken
  # because Docker and SystemD
  privileged: true
  chef_version: <%= ENV['CHEF_VERSION'] || 'current' %>

transport:
  name: dokken

provisioner:
  name: dokken
  chef_license: accept
  client_rb:
    file_atomic_update: false

verifier:
  name: inspec

platforms:
  - name: amazonlinux-2
    driver:
      image: dokken/amazonlinux-2
      pid_one_command: /usr/lib/systemd/systemd

  - name: debian-11
    driver:
      image: dokken/debian-11
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update

  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update

  - name: rockylinux-8
    driver:
      image: dokken/rockylinux-8
      pid_one_command: /usr/lib/systemd/systemd

  - name: rockylinux-9
    driver:
      image: dokken/rockylinux-9
      pid_one_command: /usr/lib/systemd/systemd

  - name: ubuntu-20.04
    driver:
      image: dokken/ubuntu-20.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update

  - name: ubuntu-22.04
    driver:
      image: dokken/ubuntu-22.04
      pid_one_command: /bin/systemd
      intermediate_instructions:
        - RUN /usr/bin/apt-get update

  - name: fedora-latest
    driver:
      image: dokken/fedora-latest
      pid_one_command: /usr/lib/systemd/systemd

suites:
  - name: wazuh-single-node
    run_list:
      - recipe[wazuh_indexer::default]
      - recipe[wazuh_manager::default]
      - recipe[wazuh_dashboard::default]
    driver:
      hostname: wazuh-single-node
    verifier:
      inspec_tests:
        - name: wazuh-indexer tests
          path: ./cookbooks/wazuh_indexer/test/integration/wazuh_indexer
        - name: wazuh-manager tests
          path: ./cookbooks/wazuh_manager/test/integration/wazuh_manager
        - name: wazuh-dashboard tests
          path: ./cookbooks/wazuh_dashboard/test/integration/wazuh_dashboard

  - name: wazuh-indexer
    run_list:
      - recipe[wazuh_indexer::default]
    driver:
      hostname: wazuh-indexer
    verifier:
      inspec_tests:
        - name: wazuh-indexer tests
          path: ./cookbooks/wazuh_indexer/test/integration/wazuh_indexer

  - name: wazuh-manager
    run_list:
      - recipe[wazuh_manager::default]
    driver:
      hostname: wazuh-manager
    verifier:
      inspec_tests:
        - name: wazuh-manager tests
          path: ./cookbooks/wazuh_manager/test/integration/wazuh_manager

  - name: wazuh-dashboard
    run_list:
      - recipe[wazuh_dashboard::default]
    driver:
      hostname: wazuh-dashboard
    verifier:
      inspec_tests:
        - name: wazuh-dashboard tests
          path: ./cookbooks/wazuh_dashboard/test/integration/wazuh_dashboard

  - name: wazuh-agent
    run_list:
      - recipe[wazuh_agent::default]
    driver:
      hostname: wazuh-agent
    attributes:
      ossec:
        address: wazuh-manager
    verifier:
      inspec_tests:
        - name: manager and agent connection test
          path: cookbooks/wazuh_agent/test/integration/wazuh_agent/manager_agent_test.rb
      inputs:
        manager_ip: wazuh-manager
        manager_port: 1514
        protocol: tcp
